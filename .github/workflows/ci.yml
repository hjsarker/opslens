name: OpsLens validation and browser tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-and-sql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce synthetic source and SQL reports
        run: python -m pipeline.build_release
      - name: Verify Python pipeline, SQL KPIs, calendars and anomalies
        run: python -m unittest discover -s tests -p 'test_analytics.py' -v && python -m unittest discover -s tests -p 'test_pipeline.py' -v
      - name: Validate exported synthetic records
        run: python -m pipeline.validate_data
  browser:
    runs-on: ubuntu-24.04
    needs: python-and-sql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Generate analytics and assets
        run: python -m pipeline.build_release
      - name: Verify desktop, tablet and mobile interactions
        run: python tests/test_browser.py
